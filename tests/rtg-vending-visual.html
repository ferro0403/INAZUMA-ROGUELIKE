<!doctype html>
<html lang="it">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RTG — verifica visiva distributore</title>
<style>
  body{margin:0;padding:16px;background:#dce2e3;color:#14232c;font:14px system-ui}
  header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  h1{font-size:18px;margin:0}select,button{font:inherit;padding:8px}p{margin:6px 0 12px}
  iframe{display:block;border:1px solid #9ba9ad;height:860px;background:white;max-width:100%}
</style>
<header><h1>Distributore RTG · verifica visiva</h1>
<label>Season <select id="season"><option value="ie1">Season 1</option><option value="ie1_s2">Season 2</option><option value="ie1_s3">Season 3</option><option value="ie2">Ares</option><option value="orion" selected>Orion</option></select></label>
<label>Larghezza <select id="width"><option>320</option><option selected>390</option><option>430</option><option>768</option><option>1024</option></select></label>
<label>Esito <select id="rarity"><option>Normale</option><option>Buono</option><option>Forte</option><option>Elite</option><option>Mondiale</option><option selected>Leggenda</option><option>Aurico</option></select></label>
<button id="reload">Ricarica prova</button></header>
<p>Fixture isolata: CSS, vista e controller reali; pool e risultato simulati. Nessun salvataggio, costo o account viene modificato. Premi GIRA per controllare la sequenza.</p>
<iframe id="preview" title="Distributore con larghezza di viewport selezionata"></iframe>
<script>
(async()=>{
  const index=await (await fetch('../index.html')).text();
  const styles=Array.from(new DOMParser().parseFromString(index,'text/html').querySelectorAll('link[rel="stylesheet"]')).map(link=>link.outerHTML).join('\n');
  const frame=document.getElementById('preview');
  function render(){
    frame.style.width=document.getElementById('width').value+'px';
    const seasonId=document.getElementById('season').value,rarity=document.getElementById('rarity').value;
    frame.srcdoc=`<!doctype html><html lang="it"><head><base href="../"><meta name="viewport" content="width=device-width,initial-scale=1">${styles}</head><body><div id="modal-root"></div>
    <script src="js/road-to-glory/rtg-config.js"><\/script>
    <script src="js/road-to-glory/rtg-route-view.js"><\/script>
    <script src="js/road-to-glory/rtg-album-view.js"><\/script>
    <script src="js/road-to-glory/rtg-run-view.js"><\/script>
    <script src="js/road-to-glory/rtg-vending-motion.js"><\/script>
    <script src="js/road-to-glory/rtg-vending-controller.js"><\/script>
    <script>
    const root=document.getElementById('modal-root');
    const realView=RoadToGloryRunView.create({escapeHtml:s=>String(s)});
    const campaign={tokens:900};
    let pulls=0;
    let observedCapsules=[];
    const pose=el=>{const match=el.style.transform.match(/translate3d\\(([-.0-9]+)px,\\s*([-.0-9]+)px/);return match?[Number(match[1]),Number(match[2])]:[0,0];};
    root.addEventListener('click',event=>{
      if(event.target.closest('[data-rtg-pull]'))observedCapsules=Array.from(root.querySelectorAll('[data-capsule-rarity]'),el=>({el,start:pose(el),peak:0}));
    });
    new MutationObserver(()=>{
      for(const item of observedCapsules){const current=pose(item.el);item.peak=Math.max(item.peak,Math.hypot(current[0]-item.start[0],current[1]-item.start[1]));}
    }).observe(root,{subtree:true,attributes:true,attributeFilter:['style']});
    const motionReport=()=>'<p>Capsule mosse: '+observedCapsules.filter(item=>item.peak>20).length+'/14 · Spostamento massimo medio: '+(observedCapsules.reduce((sum,item)=>sum+item.peak,0)/14).toFixed(1)+' px</p>';
    const runtime=RoadToGloryVendingController.create({
      getCampaign:()=>campaign,getSeasonDb:()=>({}),activeSeasonId:()=>${JSON.stringify(seasonId)},
      activeConfig:()=>RoadToGloryConfig.season(${JSON.stringify(seasonId)}),accessibleCards:()=>[],
      gacha:{previewPool:()=>({candidates:['fixture'],rarities:['Normale','Buono','Forte','Elite','Mondiale','Leggenda','Aurico'].map(rarity=>({rarity,weight:100/7}))})},
      runView:{...realView,pullResultMarkup:()=>'<div class="rtg-paper-modal" style="padding:24px"><h2>Sequenza completata</h2><p>Richieste di estrazione: '+pulls+'</p><p>Risultato simulato: ${rarity}</p>'+motionReport()+'<button class="btn btn-yellow" data-rtg-pull-continue>Riprova</button></div>'},
      getModalRoot:()=>root,
      openModal:html=>{root.innerHTML='<div class="modal-backdrop"><section class="modal rtg-modal rtg-vending-modal">'+html+'</section></div>'},
      closeModal:()=>runtime.openVending(),renderAlbum:()=>{},
      pull:async()=>{pulls++;return {result:{rarity:${JSON.stringify(rarity)}},player:{category:${JSON.stringify(rarity)}}}}
    });
    runtime.openVending();
    <\/script></body></html>`;
  }
  document.querySelectorAll('select').forEach(select=>select.addEventListener('change',render));
  document.getElementById('reload').addEventListener('click',render);
  render();
})();
</script>
</html>
