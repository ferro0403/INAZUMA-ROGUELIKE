name: Fix RTG development lazy loading
"on": push
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rtg-shop-development
      - name: Apply and verify
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('js/road-to-glory/rtg-controller.js')
          s=p.read_text()
          s=s.replace('    let developmentPage=1;\n    const DEVELOPMENT_PLAYER_PAGE_SIZE=24;', '    let developmentVisibleCount=24;\n    const DEVELOPMENT_PLAYER_PAGE_SIZE=24;')
          a=s.index('    function bindDevelopmentGrid(players){')
          b=s.index('    function renderDevelopment(tab="players"){',a)
          block='''    function bindDevelopmentGrid(players){
              const results=app?.querySelector?.("[data-rtg-development-results]");
              if(!results)return;
              const refresh=()=>{
                const filtered=filteredDevelopmentPlayers(players);
                const visible=filtered.slice(0,developmentVisibleCount);
                const remaining=Math.max(0,filtered.length-visible.length);
                results.innerHTML=economyView.playerGrid(visible)+(remaining>0?`<div class="development-load-more-wrap"><button type="button" class="btn btn-yellow development-load-more" data-rtg-development-load-more><span>MOSTRA ALTRI <b>${Math.min(DEVELOPMENT_PLAYER_PAGE_SIZE,remaining)}</b></span><small>${visible.length} di ${filtered.length}</small></button></div>`:"");
              };
              results.onclick=(event)=>{
                const loadMore=event.target?.closest?.("[data-rtg-development-load-more]");
                if(loadMore){developmentVisibleCount+=DEVELOPMENT_PLAYER_PAGE_SIZE;refresh();return;}
                const element=event.target?.closest?.("[data-rtg-development-player]");
                if(!element)return;
                selectedDevelopmentCardId=id(element.dataset.rtgDevelopmentPlayer);
                renderDevelopment("players");
              };
              const search=app?.querySelector?.("[data-rtg-development-search]");
              search?.addEventListener("input",(event)=>{developmentQuery=event.currentTarget.value||"";developmentVisibleCount=DEVELOPMENT_PLAYER_PAGE_SIZE;refresh();});
              app?.querySelector?.("[data-rtg-development-rarity]")?.addEventListener("change",(event)=>{developmentRarity=event.currentTarget.value||"Tutti";developmentVisibleCount=DEVELOPMENT_PLAYER_PAGE_SIZE;refresh();});
              refresh();
            }
'''
          s=s[:a]+block+s[b:]
          p.write_text(s)
          p=Path('js/road-to-glory/rtg-economy-view.js')
          s=p.read_text()
          old='      return `<span class="development-resource-icon rtg-development-token-icon">${rtgTokenIcon()}</span>`;'
          new='      return `<span class="development-resource-icon rtg-development-token-icon" style="width:64px;height:64px;min-width:64px;display:inline-flex;align-items:center;justify-content:center;overflow:visible"><img class="rtg-token-icon" style="width:58px;height:58px;max-width:none;object-fit:contain;display:block" src="${TOKEN_URL}" alt="" aria-hidden="true" draggable="false"></span>`;'
          if old not in s: raise SystemExit('token icon anchor missing')
          p.write_text(s.replace(old,new))
          Path('tests/rtg-development-pagination-test.js').write_text('const fs=require("fs");\nconst c=fs.readFileSync("js/road-to-glory/rtg-controller.js","utf8"),v=fs.readFileSync("js/road-to-glory/rtg-economy-view.js","utf8");\nif(!/DEVELOPMENT_PLAYER_PAGE_SIZE\\s*=\\s*24/.test(c)||!/developmentVisibleCount/.test(c)||!/data-rtg-development-load-more/.test(c))throw Error("lazy batches missing");\nif(/data-rtg-development-page/.test(c))throw Error("old pages remain");\nif(!/width:58px;height:58px/.test(v))throw Error("token sizing missing");\nconsole.log("RTG development focused regression passed");\n')
          PY
          node tests/rtg-development-pagination-test.js
          rm .github/workflows/fix-rtg-development-load-more-icons.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(RTG): use lazy batches and correct token icons"
          git push origin HEAD:feature/rtg-shop-development
