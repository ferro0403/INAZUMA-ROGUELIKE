name: Fix RTG shop scroll v2
on:
  push:
    branches: [feature/rtg-shop-development]
    paths: [.github/workflows/fix-rtg-shop-scroll-v2.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rtg-shop-development
      - name: Apply root-cause fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('js/road-to-glory/rtg-controller.js')
          s=p.read_text()
          old='''      if(options.preserveMatchTimeline===true){\n        global.requestAnimationFrame?.(()=>keepLatestMatchActionVisible());\n      }else{\n        deps.resetRenderedViewScroll?.();\n      }'''
          new='''      if(options.preserveMatchTimeline===true){\n        global.requestAnimationFrame?.(()=>keepLatestMatchActionVisible());\n      }else if(options.preserveScroll!==true){\n        deps.resetRenderedViewScroll?.();\n      }'''
          assert old in s, 'renderHtml reset block not found'
          s=s.replace(old,new,1)
          old='''    function renderShop(){\n      if(!economyView||!economy)return renderRun();\n      selectedDevelopmentCardId=null;\n      renderHtml(economyView.shopMarkup({state:campaign}));'''
          new='''    function renderShop(options={}){\n      if(!economyView||!economy)return renderRun();\n      selectedDevelopmentCardId=null;\n      renderHtml(economyView.shopMarkup({state:campaign}),{preserveScroll:options.preserveScroll===true});'''
          assert old in s, 'renderShop header not found'
          s=s.replace(old,new,1)
          old='''        renderShop();\n        const restoreShopScroll=()=>global.scrollTo?.(0,shopScrollY);\n        if(typeof global.requestAnimationFrame==="function")global.requestAnimationFrame(restoreShopScroll);\n        else if(typeof global.setTimeout==="function")global.setTimeout(restoreShopScroll,0);\n        else restoreShopScroll();'''
          new='''        renderShop({preserveScroll:true});\n        const restoreShopScroll=()=>global.scrollTo?.(0,shopScrollY);\n        if(typeof global.requestAnimationFrame==="function")global.requestAnimationFrame(()=>global.requestAnimationFrame(restoreShopScroll));\n        else if(typeof global.setTimeout==="function")global.setTimeout(restoreShopScroll,0);\n        else restoreShopScroll();'''
          assert old in s, 'purchase restore block not found'
          s=s.replace(old,new,1)
          p.write_text(s)
          Path('.github/workflows/fix-rtg-shop-scroll-v2.yml').unlink()
          PY
          git diff --check
          grep -q 'preserveScroll' js/road-to-glory/rtg-controller.js
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(RTG): preserve shop viewport after purchase'
          git push origin HEAD:feature/rtg-shop-development
