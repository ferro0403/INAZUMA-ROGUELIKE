name: Repair Nakata HQ asset

on:
  push:
    branches: [season3]
    paths:
      - '.nakata_hq/**'
      - '.github/workflows/repair-nakata.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: season3
          fetch-depth: 0

      - name: Rebuild and validate Nakata fullbody
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, base64, os
          expected_chunks = [
              ('chunk00',4000,'6c59e12bc22a4e6087c10182d3a97e8333b3c7439a619327187856dc3e7e3d7a'),
              ('chunk01',4000,'9cc5943061bbe719df256d527717239e5f277c7597ece2e331244bd4f583a5da'),
              ('chunk02',4000,'8f98cde3b12461a46f558ba1bf71a3267dc10856e9a02ca68be3004b0e9e52cf'),
              ('chunk03',4000,'61e8bb7411564c69f703dde846cef939b40a324e182440e77c9582b1f88826d1'),
              ('chunk04',4000,'52a71cb8068404d52465d50b56d8e834104c46b1f79e33533fad24e64e28e7a8'),
              ('chunk05',4000,'b170227667a7ceb3975d1b66039499454648f4708c5c8e057a204005ed05f449'),
              ('chunk06',4000,'1d60baef213db3f06b88580bf8b41df538c0d39b81f1cdb8e6190e019ad47b6b'),
              ('chunk07',2584,'52f7dded2eeff9ffb1b23918b93acb6c0f522db26696598d84ce1e689918b030'),
          ]
          encoded = ''
          for name, expected_len, expected_sha in expected_chunks:
              text = ''.join(Path('.nakata_hq', name).read_text().split())
              actual_sha = hashlib.sha256(text.encode()).hexdigest()
              print(name, len(text), actual_sha)
              assert len(text) == expected_len, (name, len(text), expected_len)
              assert actual_sha == expected_sha, (name, actual_sha, expected_sha)
              encoded += text
          data = base64.b64decode(encoded, validate=True)
          expected_size = 22936
          expected_sha = '382f9d9fb46ab69e65bc56302dd491624b616ada4cff5133d4856371d09cd1ab'
          assert len(data) == expected_size, (len(data), expected_size)
          assert data[:4] == b'RIFF' and data[8:12] == b'WEBP', data[:12]
          assert hashlib.sha256(data).hexdigest() == expected_sha
          target = Path('assets/players/season3/custom_0001_nakata_fullbody.webp')
          tmp = target.with_suffix('.webp.tmp')
          tmp.write_bytes(data)
          os.replace(tmp, target)
          PY

      - name: Commit repaired asset and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .nakata_hq .nakata_repair
          rm -f .github/workflows/repair-nakata.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Replace Nakata fullbody with high-quality asset'
          git push origin HEAD:season3
