name: PR363 temporary finalizer

on:
  push:
    branches:
      - codex/fix-match-recovery-and-game-over-rewards

permissions:
  contents: write

concurrency:
  group: pr363-temporary-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: codex/fix-match-recovery-and-game-over-rewards
          fetch-depth: 2

      - name: Verify baseline parent
        shell: bash
        run: |
          set -euo pipefail
          echo "workflow HEAD=$(git rev-parse HEAD)"
          echo "parent=$(git rev-parse HEAD^)"
          test "$(git rev-parse HEAD^)" = "98ca40bca6502f6c5c8dfc5e8c7dbca60d6f9668"
          test "$(git rev-parse 'HEAD^^{tree}')" = "78213b7619ff4b25741faaeb2c057fbd8582bb8b"

      - name: Add final regression tests before production patch
        shell: bash
        run: |
          set -euo pipefail
          cat > tests/five-edit-transaction-final-gate-test.js <<'EOF'
          "use strict";

          const assert = require("assert");
          const BudgetStorage = require("./helpers/budget-storage");
          const { load } = require("./helpers/production-runtime");

          const positions = ["GK", "DF", "DF", "DF", "DF", "MF", "MF", "MF", "FW", "FW", "FW"];
          const players = positions.map((position, index) => ({ playerId: `p${index}`, name: `P${index}`, position, category: "Normale", overall: 50, finalOverall: 50, stats: {} }));
          const fiveFormation = { id: "five", name: "2-1-1", summary: "Test", slots: [
            { key: "GK", role: "GK", line: "goal" }, { key: "DF1", role: "DF", line: "defense" }, { key: "DF2", role: "DF", line: "defense" },
            { key: "MF", role: "MF", line: "midfield" }, { key: "FW", role: "FW", line: "attack" },
          ] };
          const FiveVFive = {
            formations: [fiveFormation],
            ensure: run => run.fiveVFive,
            formationById: () => fiveFormation,
            validate: run => ({ valid: true, formation: fiveFormation, assignedCount: 5, messages: [], slots: run.fiveVFive.slots }),
            assign() {}, clearSlot() {}, changeFormation() {}, removeUnavailable() {},
          };
          const seasonDb = {
            seasonId: "ie1", players,
            formations: { eleven: [{ id: "4-3-3", requirements: { GK: 1, DF: 4, MF: 3, FW: 3 }, slotRoles: positions }] },
            bossOrder: [{ teamId: "boss", teamName: "Boss", bossFormation: "4-3-3", bossLevel: 1, startingXIPlayerIds: players.map(player => player.playerId) }],
          };

          function zone() {
            return { bossIndex: 0, bossId: "boss", seed: "zone", currentNodeId: "start", startNodeId: "start", pendingNodeId: "five-node", completedNodeIds: ["start"], path: ["start"],
              nodes: [{ id: "start", type: "start", layer: 0 }, { id: "five-node", type: "five_v_five", layer: 1 }, { id: "boss-node", type: "boss", layer: 1 }],
              edges: [["start", "five-node"], ["start", "boss-node"]] };
          }

          function preMatch() {
            return {
              matchId: "stable-five-edit", type: "five_v_five", nodeId: "five-node", previousNodeId: "start", state: "pre-match", result: null, log: [],
              opponentFormation: "five", opponents: fiveFormation.slots.map((slot, index) => ({ slotKey: slot.key, playerId: `opponent-${index}` })), simulation: null,
            };
          }

          function simulatingMatch() {
            return {
              ...preMatch(), state: "simulating",
              simulation: { valid: true, state: "simulating", seed: "stable-five-seed", winner: "user", score: { user: 1, opponent: 0 }, displayedScore: { user: 0, opponent: 0 }, revealedCount: 0, resolutionApplied: false, timeline: [{ minute: 8, type: "goal", team: "user", text: "Gol" }] },
            };
          }

          function runFor(activeMatch) {
            return { runId: "five-edit-final", seasonId: "ie1", phase: "match", lives: 2, gameOver: false, bossIndex: 0, consecutiveLosses: 0,
              completedBossIds: [], unlockedTeamIds: [], completedSpecialMatchIds: [], unlockedSpecialTeamIds: [], claimedSpecialMatchRewardIds: [], permanentEffectOutbox: [],
              roster: players.map(player => ({ playerId: player.playerId, source: "ie1", level: 0 })), lineup: players.map(player => player.playerId), bench: [], inventory: [],
              formationId: "4-3-3", fiveVFive: { formation: "five", slots: { GK: "p0", DF1: "p1", DF2: "p2", MF: "p5", FW: "p8" } },
              teamIdentity: { name: "Raimon" }, statistics: {}, teamLevel: 0, currentZone: zone(), activeMatch };
          }

          function runtime(activeMatch) {
            const storage = new BudgetStorage(Infinity);
            const fetch = async url => ({ ok: true, json: async () => String(url).includes("FREE_AGENTS") ? { players: [] } : { players: {} } });
            const rt = load(storage, { run: runFor(activeMatch), seasonDb, contextOverrides: { FiveVFive, fetch } });
            rt.context.MapEngine.normalizeSpecialMatchNode = () => false;
            rt.context.MatchSimulatorConfig = { eventDelayMs: 1, playbackMs: 1 };
            rt.context.setTimeout = () => 1;
            rt.context.clearTimeout = () => {};
            rt.context.RoguelikeRules.isProfileAwareRosterEntry = () => false;
            rt.context.RoguelikeRules.migrateDefeatedBossPlayerLevels = () => false;
            rt.context.SeasonRegistry.player = id => players.find(player => player.playerId === String(id));
            return { storage, rt };
          }

          (async () => {
            // Success + double click: entering the editor is one canonical write,
            // phase=five is already durable, and the presentation render adds no save.
            {
              const h = runtime(preMatch());
              h.rt.seam.renderMatch();
              const beforeMatch = structuredClone(h.rt.canonical.activeMatch);
              const realSave = h.rt.context.RunState.save.bind(h.rt.context.RunState);
              let writes = 0;
              h.rt.context.RunState.save = (value, options) => { writes += 1; return realSave(value, options); };
              const button = h.rt.context.document.getElementById("edit-five-team");
              button.click(); button.click();
              assert.equal(writes, 1, "5v5 editor entry must commit exactly once even on double click");
              assert.equal(h.rt.canonical.phase, "five");
              assert.equal(h.rt.canonical.activeMatch.matchId, beforeMatch.matchId);
              assert.equal(h.rt.canonical.activeMatch.state, "pre-match");
              assert.ok(h.rt.canonical.activeMatch.returnScroll, "return scroll must be canonical after the one commit");
              assert.match(h.rt.seam.getAppMarkup(), /FORMAZIONE 5V5/);
              assert.match(h.rt.seam.getAppMarkup(), /TORNA ALLA PARTITA/);
            }

            // Persistence failure: one failed write, no implicit second save, no
            // editor, and canonical state is byte-for-byte the pre-click state.
            {
              const h = runtime(preMatch());
              h.rt.seam.renderMatch();
              const canonicalBefore = structuredClone(h.rt.canonical);
              let writes = 0;
              h.rt.context.RunState.save = () => { writes += 1; const error = new Error("Quota exceeded"); error.name = "QuotaExceededError"; throw error; };
              h.rt.context.document.getElementById("edit-five-team").click();
              assert.equal(writes, 1, "failed editor entry must not attempt a second save");
              assert.deepEqual(h.rt.canonical, canonicalBefore, "failed editor entry must preserve canonical state");
              assert.equal(h.rt.canonical.phase, "match");
              assert.equal(h.rt.canonical.activeMatch.matchId, canonicalBefore.activeMatch.matchId);
              assert.equal(h.rt.canonical.activeMatch.returnScroll, undefined);
              assert.match(h.rt.seam.getAppMarkup(), /SALVATAGGIO NON RIUSCITO/);
              assert.doesNotMatch(h.rt.seam.getAppMarkup(), /FORMAZIONE 5V5/);
            }

            // Once frozen/simulating, editing is unavailable both visually and
            // at runtime even if a test harness invokes the listener directly.
            {
              const h = runtime(simulatingMatch());
              h.rt.seam.renderMatch();
              assert.match(h.rt.seam.getAppMarkup(), /id="edit-five-team"[^>]*disabled/, "simulating 5v5 must disable edit-team");
              const canonicalBefore = structuredClone(h.rt.canonical);
              const realSave = h.rt.context.RunState.save.bind(h.rt.context.RunState);
              let writes = 0;
              h.rt.context.RunState.save = (value, options) => { writes += 1; return realSave(value, options); };
              h.rt.context.document.getElementById("edit-five-team").click();
              assert.equal(writes, 0, "simulating 5v5 cannot enter editor");
              assert.deepEqual(h.rt.canonical, canonicalBefore);
            }

            console.log("five edit final gate: one commit, fail-stop, double-click and simulating lock OK");
          })().catch(error => { console.error(error); process.exitCode = 1; });
          EOF

          cat > tests/special-node-normalize-resume-final-gate-test.js <<'EOF'
          "use strict";

          const assert = require("assert");
          const BudgetStorage = require("./helpers/budget-storage");
          const { load } = require("./helpers/production-runtime");

          const positions = ["GK", "DF", "DF", "DF", "DF", "MF", "MF", "MF", "FW", "FW", "FW"];
          const players = positions.map((position, index) => ({ playerId: `p${index}`, name: `P${index}`, position, category: "Normale", overall: 50, finalOverall: 50, stats: {} }));
          const specialMatch = {
            specialMatchId: "special-1", zoneIndex: 1, teamId: "special-team", teamName: "Special Team", logoUrl: "", matchLevel: 1, matchFormation: "4-3-3",
            startingXIProfileIds: players.map(player => `profile-${player.playerId}`), startingXIPlayerIds: players.map(player => player.playerId), reward: { candidateCount: 1 },
          };
          const seasonDb = {
            seasonId: "ie1_s3", requiresProfileAwareRuntime: false, players, specialMatches: [specialMatch],
            formations: { eleven: [{ id: "4-3-3", requirements: { GK: 1, DF: 4, MF: 3, FW: 3 }, slotRoles: positions }] },
            bossOrder: [{ teamId: "boss", teamName: "Boss", bossFormation: "4-3-3", bossLevel: 1, startingXIPlayerIds: players.map(player => player.playerId) }],
          };

          function legacyZone() {
            return {
              bossIndex: 0, bossId: "boss", seed: "legacy-zone", currentNodeId: "start", startNodeId: "start", pendingNodeId: "legacy-special", completedNodeIds: ["start"], path: ["start", "legacy-special"],
              nodes: [
                { id: "start", type: "start", layer: 0, column: 0 },
                { id: "legacy-special", type: "special_match", layer: 2, column: 0, specialMatchId: "special-1", teamId: "special-team", teamName: "Special Team", matchLevel: 1, matchFormation: "4-3-3" },
                { id: "normalized-special", type: "pull_free_agents", layer: 3, column: 1 },
                { id: "boss-node", type: "boss", layer: 4, column: 0, bossId: "boss" },
              ],
              edges: [["start", "legacy-special"], ["legacy-special", "normalized-special"], ["normalized-special", "boss-node"]],
            };
          }

          function activeSpecialMatch() {
            return {
              matchId: "special-resume-stable", type: "special_match", nodeId: "legacy-special", previousNodeId: "start", specialMatchId: "special-1", teamId: "special-team", matchLevel: 1, matchFormation: "4-3-3",
              state: "pre-match", result: null, log: [], simulation: null,
            };
          }

          function runState() {
            return { runId: "special-normalize-final", seasonId: "ie1_s3", phase: "match", lives: 2, gameOver: false, bossIndex: 0, consecutiveLosses: 0,
              completedBossIds: [], unlockedTeamIds: [], completedSpecialMatchIds: [], unlockedSpecialTeamIds: [], claimedSpecialMatchRewardIds: [], permanentEffectOutbox: [],
              roster: players.map(player => ({ playerId: player.playerId, source: "ie1_s3", level: 0 })), lineup: players.map(player => player.playerId), bench: [], inventory: [],
              formationId: "4-3-3", fiveVFive: null, teamIdentity: { name: "Raimon" }, statistics: {}, teamLevel: 0, currentZone: legacyZone(), activeMatch: activeSpecialMatch() };
          }

          function runtime() {
            const storage = new BudgetStorage(Infinity);
            const fetch = async () => ({ ok: true, json: async () => ({ players: {} }) });
            const rt = load(storage, { run: runState(), seasonDb, contextOverrides: { fetch } });
            // Initial canonical save intentionally used requiresProfileAwareRuntime=false.
            // Turn on the real legacy normalization only after that save exists.
            seasonDb.requiresProfileAwareRuntime = true;
            rt.context.RoguelikeRules.isProfileAwareRosterEntry = () => false;
            rt.context.RoguelikeRules.migrateDefeatedBossPlayerLevels = () => false;
            rt.context.SeasonRegistry.player = id => players.find(player => player.playerId === String(id));
            rt.context.ProfiledSeasonRuntime.resolveProfile = (_seasonId, profileId) => {
              const playerId = String(profileId).replace(/^profile-/, "");
              const player = players.find(candidate => candidate.playerId === playerId);
              return player ? { ...player, profileId: String(profileId), playerId, roleVariants: [], defaultRoleVariantId: null } : null;
            };
            rt.context.MatchSimulatorConfig = { eventDelayMs: 1, playbackMs: 1 };
            rt.context.setTimeout = () => 1;
            rt.context.clearTimeout = () => {};
            return { storage, rt };
          }

          async function failureScenario(kind) {
            const h = runtime();
            const canonicalBefore = structuredClone(h.rt.canonical);
            const rawBefore = JSON.stringify([...h.storage.map.entries()]);
            const realSave = h.rt.context.RunState.save.bind(h.rt.context.RunState);
            let writes = 0;
            h.rt.context.RunState.save = () => {
              writes += 1;
              const error = new Error(kind === "stale" ? "stale" : "Quota exceeded");
              if (kind === "stale") { error.name = "RunPersistenceError"; error.code = "stale-write"; }
              else error.name = "QuotaExceededError";
              throw error;
            };

            let thrown = null;
            try { await h.rt.seam.resumeRun(); } catch (error) { thrown = error; }
            assert.equal(thrown, null, `${kind}: resume normalization failure must be handled by the canonical fail-stop`);
            assert.equal(writes, 1, `${kind}: one normalization write attempt only`);
            assert.equal(JSON.stringify([...h.storage.map.entries()]), rawBefore, `${kind}: raw canonical storage unchanged`);
            assert.deepEqual(h.rt.canonical, canonicalBefore, `${kind}: canonical run unchanged`);
            assert.equal(h.rt.canonical.activeMatch.matchId, canonicalBefore.activeMatch.matchId);
            assert.equal(h.rt.canonical.activeMatch.nodeId, "legacy-special");
            assert.match(h.rt.seam.getAppMarkup(), /SALVATAGGIO NON RIUSCITO/);

            h.rt.context.RunState.save = realSave;
            await h.rt.seam.resumeRun();
            const recovered = h.rt.canonical;
            const normalizedNode = recovered.currentZone.nodes.find(node => node.id === recovered.activeMatch.nodeId);
            assert.equal(recovered.activeMatch.matchId, canonicalBefore.activeMatch.matchId);
            assert.equal(recovered.activeMatch.nodeId, "normalized-special", `${kind}: active special match must follow the normalized node`);
            assert.ok(normalizedNode, `${kind}: activeMatch.nodeId must resolve to an existing node`);
            assert.equal(normalizedNode.type, "special_match");
            assert.equal(normalizedNode.specialMatchId, "special-1");
            assert.equal(recovered.currentZone.pendingNodeId, "normalized-special");
            assert.equal(recovered.activeMatch.simulation, canonicalBefore.activeMatch.simulation);
          }

          (async () => {
            await failureScenario("quota");
            await failureScenario("stale");
            console.log("special normalize final gate: quota/stale rollback, retry and active node identity OK");
          })().catch(error => { console.error(error); process.exitCode = 1; });
          EOF

      - name: Prove current code fails the new gates before patching
        shell: bash
        run: |
          set -euo pipefail
          five_status=0
          normalize_status=0
          node tests/five-edit-transaction-final-gate-test.js || five_status=$?
          node tests/special-node-normalize-resume-final-gate-test.js || normalize_status=$?
          echo "pre-fix five status=$five_status"
          echo "pre-fix normalize status=$normalize_status"
          test "$five_status" -ne 0
          test "$normalize_status" -ne 0

      - name: Apply surgical production patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {count}")
              return text.replace(old, new, 1)

          app_path = Path("js/app.js")
          app = app_path.read_text()

          old = '    if (global.MapEngine.normalizeSpecialMatchNode(run, seasonDb)) global.RunState.save(run);'
          new = '''    const specialNormalizationProbe = global.RunState.clone(run);
              if (global.MapEngine.normalizeSpecialMatchNode(specialNormalizationProbe, seasonDb)) {
                const normalized = persistGameplayMutation({
                  label: "special-node-normalize-resume",
                  mutate: (current) => {
                    const previousSpecialNode = current.currentZone?.nodes?.find((node) => node.type === "special_match") || null;
                    const activeSpecial = current.activeMatch?.type === "special_match" ? current.activeMatch : null;
                    const activeSpecialNodeId = activeSpecial?.nodeId == null ? null : String(activeSpecial.nodeId);
                    const changed = global.MapEngine.normalizeSpecialMatchNode(current, seasonDb);
                    if (!changed) return { changed: false };
                    if (activeSpecial && previousSpecialNode && activeSpecialNodeId === String(previousSpecialNode.id)) {
                      const normalizedSpecialNode = current.currentZone?.nodes?.find((node) => node.type === "special_match"
                        && (!activeSpecial.specialMatchId || String(node.specialMatchId) === String(activeSpecial.specialMatchId)));
                      if (!normalizedSpecialNode) throw Object.assign(new Error("Normalized special match node unavailable"), { code: "special-node-normalization-mismatch" });
                      activeSpecial.nodeId = normalizedSpecialNode.id;
                    }
                    return { changed: true };
                  },
                });
                if (!normalized.ok) return renderMapFailureRecovery();
              }'''
          app = replace_once(app, old, new, "resume special normalization")

          old = '''      const resolved = ui.bossMatchState.startsWith("completed");
              const simulating = ui.bossMatchState === "simulating";
              app.innerHTML = `'''
          new = '''      const resolved = ui.bossMatchState.startsWith("completed");
              const simulating = ui.bossMatchState === "simulating";
              const canEditFiveMatch = match.state === "pre-match"
                && ui.bossMatchState === "pre-match"
                && (!match.simulation || match.simulation.state === "pre-match");
              app.innerHTML = `'''
          app = replace_once(app, old, new, "five editability state")

          old = '<button type="button" class="btn five-match-action-cta five-match-action-cta--secondary" id="edit-five-team" ${resolved ? "disabled" : ""}>'
          new = '<button type="button" class="btn five-match-action-cta five-match-action-cta--secondary" id="edit-five-team" ${canEditFiveMatch ? "" : "disabled"}>'
          app = replace_once(app, old, new, "five edit button disabled state")

          old = '    const cont = document.getElementById("continue-match-result");\n    const status = document.querySelector(".boss-match-result-panel p");'
          new = '    const cont = document.getElementById("continue-match-result");\n    const editFive = document.getElementById("edit-five-team");\n    const status = document.querySelector(".boss-match-result-panel p");'
          app = replace_once(app, old, new, "match controls edit button lookup")

          old = '''    if (simulate) {
                simulate.disabled = Boolean(ui.matchStartLocked) || simulating || completed;
                simulate.textContent = ui.matchStartLocked ? "Avvio..." : simulating ? "Simulazione..." : completed ? "Risultato definitivo" : "Simula partita";
              }
              if (skip) {'''
          new = '''    if (simulate) {
                simulate.disabled = Boolean(ui.matchStartLocked) || simulating || completed;
                simulate.textContent = ui.matchStartLocked ? "Avvio..." : simulating ? "Simulazione..." : completed ? "Risultato definitivo" : "Simula partita";
              }
              if (editFive) {
                const activeFiveMatch = ui.match?.type === "five_v_five" ? ui.match : null;
                const canEditFiveMatch = activeFiveMatch?.state === "pre-match"
                  && ui.bossMatchState === "pre-match"
                  && (!activeFiveMatch.simulation || activeFiveMatch.simulation.state === "pre-match");
                editFive.disabled = !canEditFiveMatch;
              }
              if (skip) {'''
          app = replace_once(app, old, new, "match controls five edit lock")

          old = '      document.getElementById("edit-five-team").addEventListener("click", () => { ui.returnToMatchContext = { type: match.type, nodeId: match.nodeId, scroll: scrollSnapshot() }; match.returnScroll = ui.returnToMatchContext.scroll; persistMatchState(); renderFiveVFive({ returnToMatch: true }); });'
          new = '''      document.getElementById("edit-five-team").addEventListener("click", (event) => {
                event.preventDefault();
                const button = event.currentTarget;
                if (button.disabled) return;
                const activeMatch = run?.activeMatch;
                const editable = activeMatch?.type === "five_v_five"
                  && activeMatch.state === "pre-match"
                  && ui.bossMatchState === "pre-match"
                  && (!activeMatch.simulation || activeMatch.simulation.state === "pre-match");
                if (!editable) { button.disabled = true; return; }
                button.disabled = true;
                const capturedScroll = scrollSnapshot();
                const identity = matchTransactionIdentity(activeMatch);
                const committed = commitMatchMutation("five-match-edit-entry", identity, (currentMatch, current) => {
                  if (currentMatch.state !== "pre-match" || (currentMatch.simulation && currentMatch.simulation.state !== "pre-match")) {
                    throw Object.assign(new Error("5v5 match is no longer editable"), { code: "five-match-edit-locked" });
                  }
                  currentMatch.returnScroll = capturedScroll;
                  current.phase = "five";
                  return { type: currentMatch.type, nodeId: currentMatch.nodeId, scroll: capturedScroll };
                });
                if (!committed.ok) return renderMapFailureRecovery();
                ui.returnToMatchContext = committed.value;
                return renderFiveVFive({ persist: false, returnToMatch: true });
              });'''
          app = replace_once(app, old, new, "five edit transactional handler")

          app_path.write_text(app)

          index = Path("index.html")
          text = index.read_text()
          text = replace_once(text,
              'js/app.js?v=20260831-match-hardening-pr363-8',
              'js/app.js?v=20260831-match-hardening-pr363-9',
              'app cache buster')
          index.write_text(text)

          terminal = Path("tests/terminal-recovery-read-only-bootstrap-test.js")
          text = terminal.read_text()
          text = replace_once(text,
              'js\\/app\\.js\\?v=20260831-match-hardening-pr363-8',
              'js\\/app\\.js\\?v=20260831-match-hardening-pr363-9',
              'terminal cache assertion')
          terminal.write_text(text)

          legacy_test = Path("tests/failure-lock-five-edit-flow-test.js")
          text = legacy_test.read_text()
          text = replace_once(text,
              '    const original = frozenMatch();\n    const h = runtime(runFor({ phase: "match", activeMatch: original }));',
              '    const original = frozenMatch();\n    original.state = "pre-match";\n    original.simulation.state = "pre-match";\n    const h = runtime(runFor({ phase: "match", activeMatch: original }));',
              'existing legitimate five edit fixture')
          legacy_test.write_text(text)
          PY

      - name: Targeted final gate
        shell: bash
        run: |
          set -euo pipefail
          node tests/five-edit-transaction-final-gate-test.js
          node tests/special-node-normalize-resume-final-gate-test.js
          node tests/failure-lock-five-edit-flow-test.js
          node tests/read-only-map-orphan-match-recovery-test.js
          node tests/final-recovery-write-gap-test.js
          node tests/match-recovery-fail-stop-runtime-test.js
          node tests/match-retry-seed-regression-test.js
          node tests/recovered-match-reward-handoff-e2e-test.js
          node tests/transactional-entry-stale-recovery-test.js
          node tests/gameover-crash-matrix-test.js
          node tests/gameover-v3-coins-exactly-once-test.js
          node tests/terminal-recovery-read-only-bootstrap-test.js

      - name: Remove temporary workflow before final gate
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr363-finalize-temporary.yml

      - name: Full repository regression suite on final working tree
        shell: bash
        run: |
          set -euo pipefail
          total=0
          passed=0
          for f in tests/*test.js; do
            total=$((total + 1))
            echo "===== $f ====="
            node "$f"
            passed=$((passed + 1))
          done
          echo "FULL_SUITE TEST_FILES=$total PASSED=$passed FAILED=0 SKIPPED=0"

      - name: Static and scope checks on final working tree
        shell: bash
        run: |
          set -euo pipefail
          node --check js/app.js
          node --check js/boss-match-simulation-modal-bridge.js
          git diff --check
          git diff --stat
          git diff --name-only
          test -z "$(git diff --name-only | grep -E '^(js/(gameplay-persistence|run-state|map-generator|boss-gameover-runtime|permanent-effects)\.js)$' || true)"
          echo "FINAL_TREE_PRECOMMIT=$(git write-tree)"

      - name: Commit and push only after every gate is green
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
