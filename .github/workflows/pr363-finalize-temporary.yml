name: PR363 final surgical verification

on:
  push:
    branches:
      - codex/fix-match-recovery-and-game-over-rewards

permissions:
  contents: write

concurrency:
  group: pr363-final-surgical-verification
  cancel-in-progress: false

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fix-match-recovery-and-game-over-rewards
          fetch-depth: 20

      - name: Verify original production baseline
        shell: bash
        run: |
          set -euo pipefail
          baseline=98ca40bca6502f6c5c8dfc5e8c7dbca60d6f9668
          test "$(git rev-parse "$baseline^{tree}")" = "78213b7619ff4b25741faaeb2c057fbd8582bb8b"
          test -z "$(git diff --name-only "$baseline" HEAD | grep -E '^(js/|index\.html$)' || true)"

      - name: Prove new gates fail on old production
        shell: bash
        run: |
          set -euo pipefail
          five=0; special=0
          node tests/five-edit-transaction-final-gate-test.js || five=$?
          node tests/special-node-normalize-resume-final-gate-test.js || special=$?
          echo "PRE_FIX five=$five special=$special"
          test "$five" -ne 0
          test "$special" -ne 0

      - name: Apply surgical patch
        run: python tools/pr363-finalize-temporary.py

      - name: Targeted gates
        shell: bash
        run: |
          set -euo pipefail
          node tests/five-edit-transaction-final-gate-test.js
          node tests/special-node-normalize-resume-final-gate-test.js
          node tests/failure-lock-five-edit-flow-test.js
          node tests/read-only-map-orphan-match-recovery-test.js
          node tests/final-recovery-write-gap-test.js
          node tests/match-recovery-fail-stop-runtime-test.js
          node tests/match-retry-seed-regression-test.js
          node tests/recovered-match-reward-handoff-e2e-test.js
          node tests/transactional-entry-stale-recovery-test.js
          node tests/gameover-crash-matrix-test.js
          node tests/gameover-save-failure-ordering-test.js
          node tests/gameover-v3-coins-exactly-once-test.js
          node tests/terminal-recovery-read-only-bootstrap-test.js
          echo "TARGETED TOTAL=13 PASSED=13 FAILED=0 SKIPPED=0"

      - name: Remove temporary verification machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr363-finalize-temporary.yml
          rm -f .github/workflows/pr363-finalize-temporary-disabled.yml
          rm -f tools/pr363-finalize-temporary.py
          test ! -e .github/workflows/pr363-finalize-temporary.yml
          test ! -e .github/workflows/pr363-finalize-temporary-disabled.yml
          test ! -e tools/pr363-finalize-temporary.py

      - name: Full repository suite on exact final tree
        shell: bash
        run: |
          set -euo pipefail
          total=0
          for f in tests/*test.js; do
            total=$((total + 1))
            echo "===== $f ====="
            node "$f"
          done
          echo "FULL_SUITE TEST_FILES=$total PASSED=$total FAILED=0 SKIPPED=0"

      - name: Static and protected-scope gate on exact final tree
        shell: bash
        run: |
          set -euo pipefail
          baseline=98ca40bca6502f6c5c8dfc5e8c7dbca60d6f9668
          node --check js/app.js
          node --check js/boss-match-simulation-modal-bridge.js
          git diff "$baseline" --check
          test -z "$(git diff "$baseline" --name-only | grep -E '^js/(gameplay-persistence|run-state|map-generator|boss-gameover-runtime|permanent-effects)\.js$' || true)"
          allowed='^(js/app\.js|index\.html|tests/failure-lock-five-edit-flow-test\.js|tests/terminal-recovery-read-only-bootstrap-test\.js|tests/five-edit-transaction-final-gate-test\.js|tests/special-node-normalize-resume-final-gate-test\.js)$'
          unexpected="$(git diff "$baseline" --name-only | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected final-tree files:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
          git diff "$baseline" --stat
          git diff "$baseline" --name-only

      - name: Commit exact verified final tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finalize transactional 5v5 edit and special resume recovery"
          echo "FINAL_COMMIT=$(git rev-parse HEAD)"
          echo "FINAL_TREE=$(git rev-parse 'HEAD^{tree}')"
          git push origin HEAD:codex/fix-match-recovery-and-game-over-rewards
