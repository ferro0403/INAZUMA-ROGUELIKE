name: Deploy RTG Preview to Netlify

on:
  push:
    branches:
      - feature/rtg-shop-development
    paths:
      - ".github/workflows/deploy-rtg-netlify.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RTG branch
        uses: actions/checkout@v4

      - name: Deploy production preview site
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="${NETLIFY_AUTH_TOKEN:-${NETLIFY_TOKEN:-}}"
          if [ -z "$TOKEN" ]; then
            echo "No Netlify token secret is configured."
            exit 2
          fi
          npx -y netlify-cli@latest deploy             --prod             --dir=.             --site=f6cb3ab6-79a7-4eaa-baa1-af14f88892bb             --auth="$TOKEN"             --message="RTG shop + development preview"
