name: Apply lucky charm partial-upgrade fix

on:
  push:
    branches:
      - agent/fix-lucky-charm-partial-upgrades

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-lucky-charm-partial-upgrades
          fetch-depth: 0

      - name: Apply focused lucky charm patch
        shell: python
        run: |
          from pathlib import Path

          path = Path("js/app.js")
          source = path.read_text(encoding="utf-8")

          def replace_section(text, start_marker, end_marker, replacement, label):
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f"Start marker not found: {label}")
              end = text.find(end_marker, start)
              if end < 0:
                  raise SystemExit(f"End marker not found: {label}")
              return text[:start] + replacement.rstrip() + "\n\n" + text[end:]

          source = replace_section(
              source,
              "  function improvedCategory(category) {",
              "  function pullCandidates(pool, node) {",
              '''  function improvedCategory(category) {
            const ranks = global.SEASON1_CONFIG.categoryRanks;
            const ordered = Object.keys(ranks).sort((left, right) => ranks[left] - ranks[right]);
            const index = ordered.indexOf(category);
            if (index < 0 || index >= ordered.length - 1) return null;
            return ordered[index + 1] || null;
          }''',
              "improvedCategory",
          )

          source = replace_section(
              source,
              "  function luckyCharmPoolForPull(pullType) {",
              "  function chooseLuckyUpgrade(",
              '''  function luckyCharmPoolForPull(pullType) {
            if (pullType === "pull_free_agents") return pullPool(pullType);
            if (pullType !== "pull_unlocked_teams") return null;

            const source = global.SeasonRegistry.sourceForSeason(run?.seasonId);
            if (isProfileAwareSeason()) {
              const players = (seasonDb.profiles || [])
                .map((profile) => global.ProfiledSeasonRuntime.resolveProfile(run.seasonId, profile.profileId))
                .filter((profile) => profile && global.SpecialMatchRuntime.eligibleProfile(run, profile.profileId));
              return { players, source, database: seasonDb, profileAware: true };
            }
            return { players: seasonDb.players || [], source, database: seasonDb };
          }''',
              "luckyCharmPoolForPull",
          )

          source = replace_section(
              source,
              "  function chooseLuckyUpgrade(",
              "  function useLuckyCharmOnPull(",
              '''  function chooseLuckyUpgrade(original, available, usedIds, random) {
            const requiredCategory = improvedCategory(original.category);
            if (!requiredCategory) return null;
            const role = original.position;
            const shuffled = global.DraftEngine.shuffle(
              available.filter((player) => !usedIds.has(canonicalCandidatePlayerId(player))),
              random
            );
            const exactUpgrade = shuffled.filter((player) => player.category === requiredCategory);
            const preferred = exactUpgrade.filter((player) => player.position === role);
            return preferred[0] || exactUpgrade[0] || null;
          }

          function buildLuckyCharmUpgrades(currentCandidates, available, random) {
            if (!Array.isArray(currentCandidates) || currentCandidates.length !== 3) return null;
            const usedIds = new Set(currentCandidates.map((candidate) => canonicalCandidatePlayerId(candidate)));
            const upgradedCandidates = [];
            let upgradedCount = 0;

            currentCandidates.forEach((candidate) => {
              const selected = chooseLuckyUpgrade(candidate, available, usedIds, random);
              if (!selected) {
                upgradedCandidates.push(candidate);
                return;
              }
              usedIds.add(canonicalCandidatePlayerId(selected));
              upgradedCandidates.push(selected);
              upgradedCount += 1;
            });

            const uniqueIds = new Set(upgradedCandidates.map((candidate) => canonicalCandidatePlayerId(candidate)));
            if (uniqueIds.size !== upgradedCandidates.length) return null;
            return { candidates: upgradedCandidates, upgradedCount };
          }''',
              "lucky upgrade builder",
          )

          source = source.replace(
              'if (!Array.isArray(currentCandidates) || currentCandidates.length !== 3) return toast("Non è stato possibile migliorare tutti i candidati.");',
              'if (!Array.isArray(currentCandidates) || currentCandidates.length !== 3) return toast("Il Portafortuna richiede una selezione completa di 3 candidati.");',
              1,
          )
          old_use = '''    const upgradedCandidates = buildLuckyCharmUpgrades(currentCandidates, available, random);
            if (!upgradedCandidates || upgradedCandidates.length !== 3) return toast("Non è stato possibile migliorare tutti i candidati.");
            removeInventoryItem(luckyCharm.instanceId);
            global.RunStatistics?.recordRunAction?.(run, global.RunStatistics.ACTIONS.LUCKY_CHARM_USED, { nodeId: node.id, itemId: luckyCharm.id, instanceId: luckyCharm.instanceId, actionId: `${run.runId}:${node.id}:lucky_charm` });
            node.pullState.luckyCharmUsed = true;
            node.pullState.candidateIds = upgradedCandidates.map((player) => pullCandidateKey(player, pool));'''
          if old_use not in source:
              # Match the actual source independently of indentation introduced by YAML.
              use_start = source.find("    const upgradedCandidates = buildLuckyCharmUpgrades(currentCandidates, available, random);")
              use_end_marker = "    global.RunState.save(run);"
              use_end = source.find(use_end_marker, use_start)
              if use_start < 0 or use_end < 0:
                  raise SystemExit("Lucky charm use flow not found")
              replacement = '''    const upgradeResult = buildLuckyCharmUpgrades(currentCandidates, available, random);
            if (!upgradeResult || upgradeResult.upgradedCount < 1) return toast("Nessun candidato può salire di rarità con il Portafortuna.");
            const upgradedCandidates = upgradeResult.candidates;
            removeInventoryItem(luckyCharm.instanceId);
            global.RunStatistics?.recordRunAction?.(run, global.RunStatistics.ACTIONS.LUCKY_CHARM_USED, { nodeId: node.id, itemId: luckyCharm.id, instanceId: luckyCharm.instanceId, upgradedCount: upgradeResult.upgradedCount, actionId: `${run.runId}:${node.id}:lucky_charm` });
            node.pullState.luckyCharmUsed = true;
            node.pullState.candidateIds = upgradedCandidates.map((player) => pullCandidateKey(player, pool));
          '''
              source = source[:use_start] + replacement + source[use_end:]
          else:
              source = source.replace(old_use, '''    const upgradeResult = buildLuckyCharmUpgrades(currentCandidates, available, random);
            if (!upgradeResult || upgradeResult.upgradedCount < 1) return toast("Nessun candidato può salire di rarità con il Portafortuna.");
            const upgradedCandidates = upgradeResult.candidates;
            removeInventoryItem(luckyCharm.instanceId);
            global.RunStatistics?.recordRunAction?.(run, global.RunStatistics.ACTIONS.LUCKY_CHARM_USED, { nodeId: node.id, itemId: luckyCharm.id, instanceId: luckyCharm.instanceId, upgradedCount: upgradeResult.upgradedCount, actionId: `${run.runId}:${node.id}:lucky_charm` });
            node.pullState.luckyCharmUsed = true;
            node.pullState.candidateIds = upgradedCandidates.map((player) => pullCandidateKey(player, pool));''', 1)

          if 'if (!upgradeResult || upgradeResult.upgradedCount < 1)' not in source:
              raise SystemExit("Partial-upgrade use guard was not installed")

          path.write_text(source, encoding="utf-8")

          test = '''const assert = require("assert");
          const fs = require("fs");
          const source = fs.readFileSync("js/app.js", "utf8");

          assert(source.includes('if (index < 0 || index >= ordered.length - 1) return null;'), "Leggenda deve essere non migliorabile");
          assert(source.includes('if (pullType !== "pull_unlocked_teams") return null;'), "Il pool speciale deve distinguere il Pull squadre");
          assert(source.includes('return { players: seasonDb.players || [], source, database: seasonDb };'), "Il Talismano nel Pull squadre deve poter usare tutta la Season");
          assert(source.includes('const upgradedCandidates = [];') && source.includes('let upgradedCount = 0;'), "Il builder deve supportare miglioramenti parziali");
          assert(source.includes('upgradedCandidates.push(candidate);'), "Un candidato non migliorabile deve restare invariato");
          assert(source.includes('if (!upgradeResult || upgradeResult.upgradedCount < 1)'), "Il Talismano deve fallire solo quando nessun candidato è migliorabile");
          assert(source.includes('upgradedCount: upgradeResult.upgradedCount'), "Le statistiche devono registrare quanti candidati sono stati migliorati");
          assert(!source.includes('if (!upgradedCandidates || upgradedCandidates.length !== 3) return toast("Non è stato possibile migliorare tutti i candidati.");'), "La vecchia regola all-or-nothing non deve restare attiva");
          console.log("Lucky charm partial-upgrade regression checks passed");
          '''
          Path("tests/lucky-charm-partial-upgrade-test.js").write_text(test, encoding="utf-8")
          Path(".github/workflows/apply-lucky-charm-fix.yml").unlink()

      - name: Validate JavaScript syntax
        run: node --check js/app.js

      - name: Run lucky charm regression test
        run: node tests/lucky-charm-partial-upgrade-test.js

      - name: Run smoke tests
        run: |
          node tests/smoke-test.js
          node tests/ui-smoke-test.js

      - name: Commit focused fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js tests/lucky-charm-partial-upgrade-test.js .github/workflows/apply-lucky-charm-fix.yml
          git diff --cached --check
          git commit -m "Fix lucky charm partial upgrades"
          git push origin HEAD:agent/fix-lucky-charm-partial-upgrades
