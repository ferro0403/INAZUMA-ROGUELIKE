name: Estrai progetto ZIP

on:
  push:
    branches:
      - hack
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-project:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il branch hack
        uses: actions/checkout@v4
        with:
          ref: hack
          fetch-depth: 0

      - name: Trova ed estrai lo ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERRORE: nessun file ZIP trovato nella cartella principale."
            exit 1
          fi

          echo "ZIP trovato: $ZIP_FILE"

          TEMP_DIR="$(mktemp -d)"
          unzip -q "$ZIP_FILE" -d "$TEMP_DIR"

          shopt -s dotglob nullglob
          EXTRACTED_ITEMS=("$TEMP_DIR"/*)
          SOURCE_DIR="$TEMP_DIR"

          if [ "${#EXTRACTED_ITEMS[@]}" -eq 1 ] && [ -d "${EXTRACTED_ITEMS[0]}" ]; then
            SOURCE_DIR="${EXTRACTED_ITEMS[0]}"
          fi

          find . \
            -mindepth 1 \
            -maxdepth 1 \
            ! -name '.git' \
            -exec rm -rf {} +

          cp -a "$SOURCE_DIR"/. .

          if [ ! -f "index.html" ]; then
            echo "ERRORE: index.html non trovato dopo l'estrazione."
            exit 1
          fi

          echo "Estrazione completata correttamente."

      - name: Salva i file estratti
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
            exit 0
          fi

          git commit -m "Extract fixed project archive"
          git push origin HEAD:hack
