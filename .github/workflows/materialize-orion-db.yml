name: Materialize Orion database

on:
  push:
    branches:
      - orion

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Orion branch
        uses: actions/checkout@v4
        with:
          ref: orion

      - name: Materialize and validate Orion database
        shell: bash
        run: |
          set -euo pipefail
          cat .orion-transfer/part0 .orion-transfer/part1 .orion-transfer/part2 .orion-transfer/part3 .orion-transfer/part4 .orion-transfer/part5a .orion-transfer/part5b .orion-transfer/part5c .orion-transfer/part5d | base64 -d > /tmp/orion.json.xz
          echo "bc84cd47e17576e7d94465621dd7871a2f5dc4c284fc1a1ede04d23a5c014a85  /tmp/orion.json.xz" | sha256sum -c -
          xz -dc /tmp/orion.json.xz > data/ORION_season_compact.json
          echo "138fb23e73ea03e4636e507556b5631a65fe5b29ebdfab5d9b7665f451e7d970  data/ORION_season_compact.json" | sha256sum -c -
          python - <<'PY'
          import json
          with open("data/ORION_season_compact.json", encoding="utf-8") as f:
              db = json.load(f)
          assert db["seasonId"] == "orion"
          assert db["requiresProfileAwareRuntime"] is True
          assert db["summary"]["bosses"] == 13
          assert db["summary"]["canonicalPlayers"] == 311
          assert db["summary"]["profiles"] == 331
          assert db["summary"]["recruitmentProfileEntries"] == 131
          assert db["summary"]["warnings"] == 0
          print("Orion database validation passed")
          PY

      - name: Commit database and clean transfer files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .orion-transfer
          rm -f .github/workflows/materialize-orion-db.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Orion season database"
          git push origin HEAD:orion
