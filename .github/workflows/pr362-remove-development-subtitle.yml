name: PR362 subtitle cleanup

on:
  push:
    branches:
      - codex/finalizza-l-integrazione-v3-e-rimuovi-v2-obsoleto

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: codex/finalizza-l-integrazione-v3-e-rimuovi-v2-obsoleto
          fetch-depth: 0

      - name: Remove only Gestione Evoluzioni subtitle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('js/app.js')
          s = p.read_text()
          old = '<div><p class="eyebrow">STATO PERMANENTE CORRENTE</p><h2>GESTIONE EVOLUZIONI</h2></div><p>Slot e percorsi derivati dall’account Development V3.</p></div>'
          new = '<div><p class="eyebrow">STATO PERMANENTE CORRENTE</p><h2>GESTIONE EVOLUZIONI</h2></div></div>'
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one subtitle occurrence, found {count}')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Verify surgical diff
        shell: bash
        run: |
          node --check js/app.js
          node tests/development-management-ui-test.js
          git diff --check
          git diff -- js/app.js
          if git diff --name-only | grep -vx 'js/app.js'; then
            echo 'Unexpected changed file before commit'
            exit 1
          fi

      - name: Commit cleanup and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app.js
          git rm .github/workflows/pr362-remove-development-subtitle.yml
          git commit -m 'Remove Development management subtitle'
          git push origin HEAD:codex/finalizza-l-integrazione-v3-e-rimuovi-v2-obsoleto
