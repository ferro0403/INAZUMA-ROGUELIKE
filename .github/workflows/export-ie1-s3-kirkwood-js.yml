name: Export IE1 S3 Kirkwood JS
on:
  push:
    branches:
      - tmp/export-ie1-s3-kirkwood-js
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract corrected Kirkwood
        run: |
          python - <<'PY'
          import json, os
          src="data/IE1_S3_season_compact.json"
          with open(src, encoding="utf-8") as f:
              data=json.load(f)
          teams=data.get("teams", [])
          team=next((t for t in teams if t.get("id")=="kirkwood" or t.get("teamId")=="kirkwood" or t.get("name")=="Kirkwood"), None)
          assert team is not None, "Kirkwood team not found"
          ids=set(str(x) for x in team.get("playerIds", []))
          players=[p for p in data.get("players", []) if str(p.get("playerId")) in ids]
          profiles=[p for p in data.get("profiles", []) if p.get("teamId")=="kirkwood" or str(p.get("profileId","")).endswith("@kirkwood")]
          pool=[x for x in data.get("recruitmentPool", []) if x.get("teamId")=="kirkwood" or str(x.get("playerId")) in ids]
          by_name={p.get("name"):str(p.get("playerId")) for p in players}
          expected={
              "Alfred Meenan":"161",
              "Dan Mirthful":"162",
              "Malcolm Night":"160",
              "Toby Damian":"164",
              "Zachary Moore":"166",
          }
          for name,pid in expected.items():
              assert by_name.get(name)==pid, (name, by_name.get(name), pid)
          assert len([p for p in players if p.get("name")=="Toby Damian"])==1
          bundle={
              "seasonId": data.get("seasonId"),
              "seasonName": data.get("seasonName"),
              "team": team,
              "players": players,
              "profiles": profiles,
              "recruitmentPool": pool,
          }
          os.makedirs("export", exist_ok=True)
          with open("export/IE1_S3_KIRKWOOD_MODIFICATA.json","w",encoding="utf-8") as f:
              json.dump(bundle,f,ensure_ascii=False,indent=2); f.write("\n")
          with open("export/IE1_S3_KIRKWOOD_MODIFICATA.js","w",encoding="utf-8") as f:
              f.write("globalThis.IE1_S3_KIRKWOOD_MODIFICATA = ")
              json.dump(bundle,f,ensure_ascii=False,indent=2)
              f.write(";\n")
          print("players", len(players), "profiles", len(profiles), "pool", len(pool))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ie1-s3-kirkwood-modificata
          path: export/*
