name: Sync latest Orion base into Codex branch

on:
  push:
    branches:
      - codex/implementa-la-season-inazuma-eleven-orion

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/implementa-la-season-inazuma-eleven-orion
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync corrected Orion database from base branch
        run: |
          git fetch origin orion
          git checkout origin/orion -- data/ORION_season_compact.json

      - name: Update Orion count assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/orion-season-integration-test.js')
          s = p.read_text()
          old = '[13, 311, 331, 131]'
          new = '[13, 308, 328, 128]'
          if old in s:
              s = s.replace(old, new)
              p.write_text(s)
          elif new not in s:
              raise SystemExit('Expected Orion count assertion not found')
          PY

      - name: Verify corrected database
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const db = JSON.parse(fs.readFileSync('data/ORION_season_compact.json','utf8'));
          const counts = [db.bossOrder.length, db.players.length, db.profiles.length, db.recruitmentPool.entries.length];
          if (JSON.stringify(counts) !== JSON.stringify([13,308,328,128])) throw new Error(`Bad counts: ${counts}`);
          if (!db.teams.some(t => t.teamId === 'zeus_ares')) throw new Error('zeus_ares missing');
          if (db.teams.some(t => t.teamId === 'zeus')) throw new Error('old zeus still present');
          if (db.profiles.some(p => String(p.profileId || '').endsWith('@zeus'))) throw new Error('old @zeus profile still present');
          if (db.recruitmentPool.entries.some(e => e.sourceTeamId === 'zeus')) throw new Error('old zeus recruitment entry still present');
          console.log('Orion Zeus Ares correction verified:', counts.join('/'));
          NODE

      - name: Run focused Orion tests
        run: |
          node tests/orion-season-integration-test.js
          node tests/orion-season-registry-test.js

      - name: Commit sync and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sync-orion-codex.yml
          git add data/ORION_season_compact.json tests/orion-season-integration-test.js
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "sync: align Orion implementation with corrected Zeus Ares database"
          git push origin HEAD:codex/implementa-la-season-inazuma-eleven-orion
