name: RTG Run CSS migrate
on:
  push:
    branches: [refactor/rtg-css-cleanup]
    paths: [.github/workflows/rtg-css-migrate.yml]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/rtg-css-cleanup
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/rtg-cleanup-run-css.mjs
      - run: node tests/rtg-css-architecture-test.js
      - run: git diff --check
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add css/road-to-glory.css
          if git diff --cached --quiet; then
            echo "No legacy Run ownership left to commit"
            exit 0
          fi
          git commit -m "refactor(RTG): remove legacy run CSS ownership"
          git push
