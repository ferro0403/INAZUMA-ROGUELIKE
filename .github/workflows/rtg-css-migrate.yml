name: RTG Final Residual Migration
on:
  push:
    branches:
      - refactor/rtg-css-cleanup
    paths:
      - .github/workflows/rtg-css-migrate.yml
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/rtg-css-cleanup
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Migrate final CSS ownership
        run: node scripts/rtg-final-residual-css.mjs
      - name: Verify architecture
        run: node tests/rtg-css-architecture-test.js
      - name: Verify diff
        run: git diff --check
      - name: Commit migration
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add css/road-to-glory.css css/rtg-squad.css css/rtg-match.css css/rtg-run.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "refactor(RTG): migrate final residual CSS ownership"
          git push
