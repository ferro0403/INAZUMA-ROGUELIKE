name: Export RTG Netlify Source

on:
  push:
    branches:
      - feature/rtg-shop-development
    paths:
      - ".github/workflows/export-rtg-netlify.yml"
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: rtg-netlify-source
          path: .
          include-hidden-files: true
          retention-days: 1
