name: Apply Orion album asset fixes

on:
  push:
    branches:
      - fix/orion-album-assets

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/orion-album-assets
          fetch-depth: 0

      - name: Apply three isolated fixes
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const assert = require('assert');

          const COMET = 'https://dxi4wb638ujep.cloudfront.net/1/k/h/7/h7qfo5ydzhc.png';
          const ARABIAN = 'https://dxi4wb638ujep.cloudfront.net/1/k/f/i/fimtzdhsxhu.png';

          // 1) Album home: make the collection count derive from AlbumProgress.
          const appPath = 'js/app.js';
          const appBefore = fs.readFileSync(appPath, 'utf8');
          const staleAlbumCount = '3 COLLEZIONI';
          const dynamicAlbumCount = '${Object.keys(global.AlbumProgress?.ALBUM_COLLECTIONS || {}).length} COLLEZIONI';
          assert.strictEqual((appBefore.match(/3 COLLEZIONI/g) || []).length, 1, 'Expected exactly one stale album collection count');
          const appAfter = appBefore.replace(staleAlbumCount, dynamicAlbumCount);
          assert.notStrictEqual(appAfter, appBefore, 'Album count replacement did not apply');
          fs.writeFileSync(appPath, appAfter);

          // 2) Development Center: official Comet Pendant for the Orion cup.
          const devPath = 'js/development-v2.js';
          const devBefore = fs.readFileSync(devPath, 'utf8');
          const oldOrionCup = 'orion: "/assets/icons/icon-512.png"';
          const newOrionCup = `orion: "${COMET}"`;
          assert.strictEqual(devBefore.split(oldOrionCup).length - 1, 1, 'Expected exactly one Orion placeholder cup asset');
          const devAfter = devBefore.replace(oldOrionCup, newOrionCup);
          fs.writeFileSync(devPath, devAfter);

          // 3) Orion DB: replace Arabian Firebirds crest only, preserving every other datum.
          const dbPath = 'data/ORION_season_compact.json';
          const rawBefore = fs.readFileSync(dbPath, 'utf8');
          const dbBefore = JSON.parse(rawBefore);
          const dbAfter = JSON.parse(rawBefore);

          const ids = new Set(['arabian_firebirds', 'arabian-firebirds']);
          const names = new Set(['Arabian Firebirds']);
          const logoKeys = new Set(['logoUrl', 'teamLogoUrl', 'sourceTeamLogoUrl', 'bossLogoUrl']);
          const changedPaths = [];

          function ownArabianIdentity(obj) {
            if (!obj || typeof obj !== 'object' || Array.isArray(obj)) return false;
            const idFields = ['teamId', 'sourceTeamId', 'bossTeamId', 'id'];
            if (idFields.some((key) => ids.has(String(obj[key] || '')))) return true;
            const nameFields = ['teamName', 'sourceTeamName', 'bossTeamName', 'name'];
            if (nameFields.some((key) => names.has(String(obj[key] || '')))) return true;
            const profileId = String(obj.profileId || '');
            return profileId.endsWith('@arabian_firebirds') || profileId.endsWith('@arabian-firebirds');
          }

          function walk(node, path = '$', inheritedArabian = false) {
            if (Array.isArray(node)) {
              node.forEach((value, index) => walk(value, `${path}[${index}]`, inheritedArabian));
              return;
            }
            if (!node || typeof node !== 'object') return;
            const isArabian = inheritedArabian || ownArabianIdentity(node);
            if (isArabian) {
              // The canonical team must receive logoUrl even if the old record omitted it.
              if (ownArabianIdentity(node) && (ids.has(String(node.teamId || '')) || names.has(String(node.name || '')))) {
                if (node.logoUrl !== ARABIAN) {
                  changedPaths.push(`${path}.logoUrl`);
                  node.logoUrl = ARABIAN;
                }
              }
              for (const key of logoKeys) {
                if (Object.prototype.hasOwnProperty.call(node, key) && node[key] !== ARABIAN) {
                  changedPaths.push(`${path}.${key}`);
                  node[key] = ARABIAN;
                }
              }
            }
            for (const [key, value] of Object.entries(node)) {
              // Do not let generic nested player objects inherit the team association unless
              // the enclosing object is itself an Arabian team/profile container.
              walk(value, `${path}.${key}`, isArabian);
            }
          }
          walk(dbAfter);

          assert(changedPaths.length > 0, 'No Arabian Firebirds logo field was changed');
          const canonicalArabian = (dbAfter.teams || []).find((team) => ids.has(String(team.teamId || '')) || names.has(String(team.name || '')));
          assert(canonicalArabian, 'Arabian Firebirds canonical team not found');
          assert.strictEqual(canonicalArabian.logoUrl, ARABIAN, 'Canonical Arabian Firebirds logo was not updated');

          // Prove that only Arabian-associated logo fields changed in the DB.
          function normalizeArabianLogos(value, inheritedArabian = false) {
            if (Array.isArray(value)) return value.map((item) => normalizeArabianLogos(item, inheritedArabian));
            if (!value || typeof value !== 'object') return value;
            const copy = {};
            const isArabian = inheritedArabian || ownArabianIdentity(value);
            for (const [key, child] of Object.entries(value)) {
              if (isArabian && logoKeys.has(key)) copy[key] = '__ARABIAN_LOGO__';
              else copy[key] = normalizeArabianLogos(child, isArabian);
            }
            // Canonical logoUrl could be newly added: normalize both sides consistently below.
            if (isArabian && (ids.has(String(value.teamId || '')) || names.has(String(value.name || '')))) copy.logoUrl = '__ARABIAN_LOGO__';
            return copy;
          }
          assert.deepStrictEqual(normalizeArabianLogos(dbBefore), normalizeArabianLogos(dbAfter), 'Orion DB changed outside Arabian Firebirds logo fields');

          // Preserve current minified JSON style.
          fs.writeFileSync(dbPath, JSON.stringify(dbAfter));

          // Core DB invariants must remain untouched.
          const counts = [dbAfter.bossOrder?.length, dbAfter.players?.length, dbAfter.profiles?.length, dbAfter.recruitmentPool?.entries?.length];
          assert.deepStrictEqual(counts, [13, 308, 328, 128], 'Orion DB counts changed');
          assert(dbAfter.teams?.some((team) => String(team.teamId) === 'zeus_ares'), 'Zeus Ares missing after asset update');
          assert(!dbAfter.teams?.some((team) => String(team.teamId) === 'zeus'), 'Obsolete Zeus reappeared');

          console.log('Album count: dynamic');
          console.log('Orion cup:', COMET);
          console.log('Arabian Firebirds logo:', ARABIAN);
          console.log('Arabian logo fields changed:', changedPaths.length);
          changedPaths.forEach((p) => console.log('  ', p));
          console.log('Orion counts:', counts.join('/'));
          NODE

      - name: Static checks
        run: |
          git diff --check
          node --check js/app.js
          node --check js/development-v2.js

      - name: Run targeted regression tests
        run: |
          node tests/orion-season-integration-test.js
          node tests/orion-season-registry-test.js
          node tests/development-v2-test.js
          node tests/development-center-tools-test.js
          node tests/album-free-agent-sync-test.js
          node tests/season-select-simplified-test.js

      - name: Run complete repository test suite
        run: |
          passed=0
          failed=0
          for f in tests/*-test.js; do
            echo "=== $f ==="
            if node "$f"; then
              passed=$((passed+1))
            else
              failed=$((failed+1))
            fi
          done
          echo "TEST_FILES_PASSED=$passed"
          echo "TEST_FILES_FAILED=$failed"
          test "$failed" -eq 0

      - name: Commit isolated fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js js/development-v2.js data/ORION_season_compact.json
          git diff --cached --quiet && { echo "No changes to commit"; exit 1; }
          git commit -m "fix: polish Orion album assets"
          git push origin HEAD:fix/orion-album-assets
