name: PR361 cache refresh fix

on:
  push:
    branches:
      - codex/implement-development-v3-regression

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.event.head_commit.message != 'Apply Development regression cache refresh'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/implement-development-v3-regression
          fetch-depth: 0

      - name: Apply surgical cache invalidation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('js/app.js')
          text = path.read_text()
          old = '''      if (!result.ok) { closeModal({ invokeOnClose: false }); toast(result.reason === "stale-regression" ? "Evoluzione già cambiata: aggiornata la lista" : "Regressione non salvata", "error"); return renderDevelopmentCenter("management"); }
          closeModal({ invokeOnClose: false }); toast(`${row.name}: ${result.to.rarity} ${result.to.potential}`); renderDevelopmentCenter("management");'''
          new = '''      if (!result.ok) { closeModal({ invokeOnClose: false }); toast(result.reason === "stale-regression" ? "Evoluzione già cambiata: aggiornata la lista" : "Regressione non salvata", "error"); return renderDevelopmentCenter("management"); }
          developmentPlayersCache = null;
          developmentResolvedCache.delete(String(row.playerId));
          closeModal({ invokeOnClose: false }); toast(`${row.name}: ${result.to.rarity} ${result.to.potential}`); renderDevelopmentCenter("management");'''
          if old not in text:
              raise SystemExit('Expected regression success block not found; refusing to edit')
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one success block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          node --check js/app.js
          node tests/development-management-ui-test.js
          node tests/development-account-v3-test.js

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/pr361-cache-refresh-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js .github/workflows/pr361-cache-refresh-fix.yml
          git diff --cached --check
          git commit -m "Apply Development regression cache refresh"
          git push origin HEAD:codex/implement-development-v3-regression
