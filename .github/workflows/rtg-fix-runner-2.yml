name: RTG Fix Runner 2
on:
  push:
    branches:
      - feature/rtg-shop-development
    paths:
      - '.github/workflows/rtg-fix-runner-2.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rtg-shop-development
      - name: Apply fix
        run: echo '' | base64 -d | python3
      - name: Verify
        run: node tests/rtg-development-pagination-test.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(RTG): match run development loading and token icons"
          git push origin HEAD:feature/rtg-shop-development
