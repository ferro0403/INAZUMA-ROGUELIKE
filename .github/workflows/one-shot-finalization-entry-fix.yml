name: One-shot finalization entry fix
on:
  push:
    branches:
      - hardening/finalization-entry-persistence
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/finalization-entry-persistence
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch and targeted verification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          app = Path('js/app.js')
          s = app.read_text()
          old = '''  function persistChampionBeforeFinalUi(finalBoss = null) {
    const boss = finalBoss || seasonDb.bossOrder[Math.min(Number(run.bossIndex || 1) - 1, seasonDb.bossOrder.length - 1)] || seasonDb.bossOrder.at(-1);
    if (!run.finalization) {
      run.completedAt = run.completedAt || new Date().toISOString();
      const snapshot = buildChampionSnapshot(boss);
      run.phase = "finalization";
      run.finalization = { status: "pending", archiveKey: snapshot.archiveKey, hallTeamId: snapshot.hallTeamId };
      global.PermanentEffects.enqueueHall(run, snapshot);
      try {
        global.RunState.save(run);
      } catch (error) {
        console.error("save failed (persistChampionBeforeFinalUi)", error);
        toast("Salvataggio della vittoria non riuscito, riprova.", "error");
      }
    }
    drainPermanentEffects();
    return run.hallTeamId ? global.HallOfFameStorage.getTeam(run.hallTeamId) : null;
  }
'''
          new = '''  function persistChampionBeforeFinalUi(finalBoss = null) {
    const boss = finalBoss || seasonDb.bossOrder[Math.min(Number(run.bossIndex || 1) - 1, seasonDb.bossOrder.length - 1)] || seasonDb.bossOrder.at(-1);
    if (!run.finalization) {
      const committed = persistGameplayMutation({
        label: "champion-finalization-entry",
        mutate: (current) => {
          current.completedAt = current.completedAt || new Date().toISOString();
          const snapshot = buildChampionSnapshot(boss);
          current.phase = "finalization";
          current.finalization = { status: "pending", archiveKey: snapshot.archiveKey, hallTeamId: snapshot.hallTeamId };
          global.PermanentEffects.enqueueHall(current, snapshot);
        },
      });
      if (!committed.ok) return null;
    }
    drainPermanentEffects();
    return run.hallTeamId ? global.HallOfFameStorage.getTeam(run.hallTeamId) : null;
  }
'''
          if old not in s:
              raise SystemExit('persistChampionBeforeFinalUi anchor not found')
          app.write_text(s.replace(old, new, 1))

          ci = Path('.github/workflows/stacked-regression.yml')
          y = ci.read_text()
          anchor = '            tests/finalization-ambiguous-commit-production-test.js\n'
          addition = anchor + '            tests/finalization-entry-persistence-hardening-test.js\n'
          if 'tests/finalization-entry-persistence-hardening-test.js' not in y:
              if anchor not in y:
                  raise SystemExit('CI finalization anchor not found')
              y = y.replace(anchor, addition, 1)
              ci.write_text(y)
          PY
          node --check js/app.js
          node tests/finalization-entry-persistence-hardening-test.js
          node tests/app-gameplay-persistence-callsite-ownership-test.js
          node tests/finalization-ambiguous-commit-production-test.js
          node tests/real-final-boss-production-path-test.js
          node tests/terminal-effect-recovery-loop-production-test.js
          node tests/champion-hall-presentation-domain-test.js
          node tests/boss-handoff-no-nested-save-test.js
          git diff --check
      - name: Commit clean production change
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-finalization-entry-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app.js .github/workflows/stacked-regression.yml .github/workflows/one-shot-finalization-entry-fix.yml
          git diff --cached --check
          git commit -m 'hardening: serialize finalization entry before Hall effects'
          git push origin HEAD:hardening/finalization-entry-persistence
