name: Apply application UI shell extraction

on:
  push:
    branches:
      - refactor/app-ui-shell

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[auto-ui-shell]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply structural extraction
        run: node tools/apply-app-ui-shell-extraction.js
      - name: Syntax
        run: |
          node --check js/app/ui-shell.js
          node --check js/app.js
          node --check tests/app-ui-shell-domain-test.js
      - name: Targeted regression tests
        run: |
          node tests/app-ui-shell-domain-test.js
          node tests/player-presentation-production-path-test.js
          node tests/home-season-resume-production-path-test.js
          node tests/permanent-club-ui-production-path-test.js
          node tests/map-node-production-path-test.js
          node tests/inventory-equipment-production-path-test.js
          node tests/five-prematch-commit-boundary-test.js
          node tests/five-postmatch-navigation-boundary-test.js
          node tests/real-final-boss-production-path-test.js
          node tests/app-gameplay-persistence-callsite-ownership-test.js
      - name: Diff check
        run: git diff --check
      - name: Commit extracted production tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js index.html tests
          git commit -m "[auto-ui-shell] refactor: extract application UI shell"
          git push
