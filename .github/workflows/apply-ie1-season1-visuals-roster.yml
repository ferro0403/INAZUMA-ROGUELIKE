name: Apply IE1 Season 1 visual and roster corrections

on:
  push:
    branches:
      - fix/ie1-season1-visuals-roster

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ie1-season1-visuals-roster
          fetch-depth: 0

      - name: Apply and validate IE1 data-only corrections
        shell: bash
        run: |
          python - <<'PY'
          import copy
          import json
          from pathlib import Path

          season_path = Path('data/IE1_season_compact.json')
          visuals_path = Path('data/PLAYER_VISUALS.json')
          season = json.loads(season_path.read_text(encoding='utf-8'))
          visuals = json.loads(visuals_path.read_text(encoding='utf-8'))['players']

          visual_sources = {
              '4483': '87', '4478': '77', '4485': '91', '4487': '95', '4480': '81',
              '4463': '161', '4464': '162', '4462': '160', '4466': '164', '4468': '166',
              '4501': '23', '4500': '22', '4506': '28', '4507': '30', '4505': '27',
              '4502': '24', '4503': '25', '4504': '26', '4499': '21',
          }
          removed = {
              '4484': 'Darren Gouger', '4482': 'Electra Faraday',
              '4477': 'Gideon Poe', '4461': 'Trice Topper',
          }
          brainwashing_starter_replacements = {'4484': '89', '4482': '93'}

          players_before = {str(p['playerId']): copy.deepcopy(p) for p in season['players']}
          assert len(players_before) == len(season['players']) == 161

          for season_id, visual_id in visual_sources.items():
              source_player = players_before.get(season_id)
              target_visual = visuals.get(visual_id)
              assert source_player, f'Missing Season 1 player {season_id}'
              assert target_visual, f'Missing visual source {visual_id}'
              assert source_player['name'] == target_visual.get('name'), (
                  season_id, source_player['name'], visual_id, target_visual.get('name')
              )
              assert target_visual.get('portraitUrl'), f'Missing portrait for visual source {visual_id}'
              assert target_visual.get('frontFullbodyUrl'), f'Missing fullbody for visual source {visual_id}'

          for player_id, expected_name in removed.items():
              player = players_before.get(player_id)
              assert player, f'Missing removable player {player_id}'
              assert player['name'] == expected_name, (player_id, player['name'], expected_name)

          for replacement_id in brainwashing_starter_replacements.values():
              player = players_before.get(replacement_id)
              assert player, f'Missing Brainwashing replacement {replacement_id}'
              assert player.get('normalizedRole') == 'MF', (replacement_id, player.get('normalizedRole'))
              assert player.get('teamId') == 'brainwashing', (replacement_id, player.get('teamId'))

          def remove_deleted(ids):
              out = [str(raw) for raw in ids if str(raw) not in removed]
              assert len(out) == len(set(out)), f'Duplicate ids after roster cleanup: {out}'
              return out

          for boss in season['bossOrder']:
              old_xi = [str(x) for x in boss.get('startingXIPlayerIds', [])]
              if boss.get('teamId') == 'brainwashing':
                  new_xi = [brainwashing_starter_replacements.get(pid, pid) for pid in old_xi]
              else:
                  new_xi = remove_deleted(old_xi)
              assert len(new_xi) == 11, (boss.get('teamId'), new_xi)
              assert len(set(new_xi)) == 11, (boss.get('teamId'), new_xi)
              boss['startingXIPlayerIds'] = new_xi
              starting_xi = boss.get('startingXI', [])
              assert len(starting_xi) == 11, boss.get('teamId')
              for entry, new_id in zip(starting_xi, new_xi):
                  entry['playerId'] = new_id
              boss['rewardPoolPlayerIds'] = remove_deleted(boss.get('rewardPoolPlayerIds', []))

          for team in season['teams']:
              team['playerIds'] = remove_deleted(team.get('playerIds', []))
              team['ratedPlayers'] = len(team['playerIds'])

          corrected_players = []
          for player in season['players']:
              player_id = str(player['playerId'])
              if player_id in removed:
                  continue
              if player_id in visual_sources:
                  visual = visuals[visual_sources[player_id]]
                  player['portraitUrl'] = visual['portraitUrl']
                  player['frontFullbodyUrl'] = visual['frontFullbodyUrl']
              corrected_players.append(player)
          season['players'] = corrected_players

          season['summary']['players'] = len(corrected_players)
          season['validation']['players'] = len(corrected_players)
          season['validation']['exactValuesChecked'] = len(corrected_players) * int(season['validation']['levelsPerPlayer']) * 9

          players_after = {str(p['playerId']): p for p in season['players']}
          assert len(players_after) == len(corrected_players) == 157
          for removed_id in removed:
              assert removed_id not in players_after, f'Removed player still present: {removed_id}'

          for season_id, visual_id in visual_sources.items():
              assert season_id in players_after, f'Visual-corrected player lost original id {season_id}'
              assert visual_id not in players_after, f'Visual source id was incorrectly added as player: {visual_id}'
              after = players_after[season_id]
              before = players_before[season_id]
              assert after['name'] == before['name']
              assert str(after['playerId']) == season_id
              assert str(after['id']) == season_id
              assert after['portraitUrl'] == visuals[visual_id]['portraitUrl']
              assert after['frontFullbodyUrl'] == visuals[visual_id]['frontFullbodyUrl']
              before_nonvisual = {k: v for k, v in before.items() if k not in {'portraitUrl', 'frontFullbodyUrl'}}
              after_nonvisual = {k: v for k, v in after.items() if k not in {'portraitUrl', 'frontFullbodyUrl'}}
              assert after_nonvisual == before_nonvisual, f'Gameplay/profile drift for {season_id}'

          for player_id, before in players_before.items():
              if player_id in removed or player_id in visual_sources:
                  continue
              assert players_after[player_id] == before, f'Unexpected player mutation: {player_id}'

          for team in season['teams']:
              for player_id in team.get('playerIds', []):
                  assert str(player_id) in players_after, f"Dangling team player {team.get('teamId')}:{player_id}"

          for boss in season['bossOrder']:
              for player_id in boss.get('startingXIPlayerIds', []):
                  assert str(player_id) in players_after, f"Dangling boss XI player {boss.get('teamId')}:{player_id}"
              for player_id in boss.get('rewardPoolPlayerIds', []):
                  assert str(player_id) in players_after, f"Dangling reward player {boss.get('teamId')}:{player_id}"

          brainwashing = next(b for b in season['bossOrder'] if b['teamId'] == 'brainwashing')
          assert '4484' not in brainwashing['startingXIPlayerIds']
          assert '4482' not in brainwashing['startingXIPlayerIds']
          assert '89' in brainwashing['startingXIPlayerIds']
          assert '93' in brainwashing['startingXIPlayerIds']
          assert len(brainwashing['startingXIPlayerIds']) == 11

          season_path.write_text(json.dumps(season, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          print('IE1 Season 1 data-only corrections applied:', len(corrected_players), 'players')
          PY

      - name: Validate Season runtime contracts
        run: node scripts/validate-seasons.js

      - name: Commit final data and remove temporary CI controls
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-ie1-season1-visuals-roster.yml
          git rm vercel.json
          git add data/IE1_season_compact.json
          git diff --cached --check
          git commit -m "fix: correct IE1 Season 1 visuals and roster"
          git push origin HEAD:fix/ie1-season1-visuals-roster
