name: One-shot navigation hardening

on:
  push:
    branches:
      - hardening/navigation-persistence

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: hardening/navigation-persistence
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply exact navigation hardening patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          source = path.read_text(encoding="utf-8")

          old_section = '''  function navigateToSectionRoot(section, context = {}) {
            const destination = getSectionRootDestination(section).destination;
            if (destination === "map" && run?.activeMatch) return leaveMatchViaSectionRoot();
            closeModal({ invokeOnClose: false });
            if (destination === "home") return renderHome();
            if (destination === "seasonSelection") {
              if (run) { try { global.RunState.save(run); } catch (error) { console.error("save failed (seasonSelection nav)", error); } }
              return renderSeasonSelect();
            }
            if (destination === "map") {
              if (run) { run.phase = "map"; try { global.RunState.save(run); } catch (error) { console.error("save failed (map nav)", error); } }
              return renderMap();
            }
            if (destination === "albumRoot") return renderAlbumCollections();
            if (destination === "albumTeams") return renderAlbumTeams(context.collectionId || ui.albumCollectionId || global.AlbumProgress.DEFAULT_COLLECTION_ID);
            if (destination === "hallRoot") return renderHallOfFame();
            return renderHome();
          }
'''
          new_section = '''  function navigateToSectionRoot(section, context = {}) {
            const destination = getSectionRootDestination(section).destination;
            if (destination === "map" && run?.activeMatch) return leaveMatchViaSectionRoot();
            if (destination === "map" && run) {
              if (run.phase === "map") {
                closeModal({ invokeOnClose: false });
                return renderMap({ persist: false });
              }
              const committed = persistGameplayMutation({
                label: "section-root-map-navigation",
                mutate: (current) => { current.phase = "map"; },
              });
              if (!committed.ok) return null;
              closeModal({ invokeOnClose: false });
              return renderMap({ persist: false });
            }
            closeModal({ invokeOnClose: false });
            if (destination === "home") return renderHome();
            if (destination === "seasonSelection") return renderSeasonSelect();
            if (destination === "map") return renderMap({ persist: false });
            if (destination === "albumRoot") return renderAlbumCollections();
            if (destination === "albumTeams") return renderAlbumTeams(context.collectionId || ui.albumCollectionId || global.AlbumProgress.DEFAULT_COLLECTION_ID);
            if (destination === "hallRoot") return renderHallOfFame();
            return renderHome();
          }
'''

          old_bottom = '''  function bindBottomNav() {
            document.querySelectorAll("[data-nav]").forEach((button) => {
              button.addEventListener("click", () => {
                closeModal({ invokeOnClose: false });
                const destination = button.dataset.nav;
                if (destination === "map") {
                  return resumePostBossFlowOrMap();
                } else if (destination === "squad") {
                  ensurePostBossFlow({ clearMatch: true });
                  run.phase = "squad";
                  try { global.RunState.save(run); } catch (error) { console.error("save failed (squad nav)", error); }
                  renderSquad();
                } else if (destination === "inventory") {
                  renderInventory();
                } else if (destination === "five") {
                  openFiveVFiveEditor();
                }
              });
            });
          }
'''
          new_bottom = '''  function bindBottomNav() {
            document.querySelectorAll("[data-nav]").forEach((button) => {
              button.addEventListener("click", () => {
                const destination = button.dataset.nav;
                if (destination === "map") {
                  closeModal({ invokeOnClose: false });
                  return resumePostBossFlowOrMap();
                } else if (destination === "squad") {
                  ensurePostBossFlow({ clearMatch: true });
                  if (run.phase === "squad") {
                    closeModal({ invokeOnClose: false });
                    return renderSquad();
                  }
                  const committed = persistGameplayMutation({
                    label: "bottom-nav-squad-navigation",
                    mutate: (current) => { current.phase = "squad"; },
                  });
                  if (!committed.ok) return null;
                  closeModal({ invokeOnClose: false });
                  return renderSquad();
                } else if (destination === "inventory") {
                  closeModal({ invokeOnClose: false });
                  return renderInventory();
                } else if (destination === "five") {
                  closeModal({ invokeOnClose: false });
                  return openFiveVFiveEditor();
                }
                return null;
              });
            });
          }
'''

          if source.count(old_section) != 1:
              raise SystemExit(f"section-root block mismatch: {source.count(old_section)} matches")
          if source.count(old_bottom) != 1:
              raise SystemExit(f"bottom-nav block mismatch: {source.count(old_bottom)} matches")

          source = source.replace(old_section, new_section).replace(old_bottom, new_bottom)
          path.write_text(source, encoding="utf-8")
          PY

      - name: Targeted hardening verification
        shell: bash
        run: |
          set -euo pipefail
          node --check js/app.js
          node tests/app-gameplay-persistence-transactions-test.js
          node tests/app-gameplay-persistence-callsite-ownership-test.js
          node tests/navigation-persistence-hardening-test.js
          git diff --check

      - name: Commit production patch and remove one-shot helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-navigation-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js .github/workflows/one-shot-navigation-hardening.yml
          git diff --cached --check
          git commit -m "hardening: serialize run navigation commits"
          git push origin HEAD:hardening/navigation-persistence
