name: One-shot navigation hardening
on: [push]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/navigation-persistence
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch and verify
        run: |
          python .github/one-shot-navigation-hardening.py
          node --check js/app.js
          node tests/app-gameplay-persistence-transactions-test.js
          node tests/app-gameplay-persistence-callsite-ownership-test.js
          node tests/navigation-persistence-hardening-test.js
          git diff --check
      - name: Commit clean production change
        run: |
          rm .github/one-shot-navigation-hardening.py
          rm .github/workflows/one-shot-navigation-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js .github/one-shot-navigation-hardening.py .github/workflows/one-shot-navigation-hardening.yml
          git diff --cached --check
          git commit -m "hardening: serialize run navigation commits"
          git push origin HEAD:hardening/navigation-persistence
