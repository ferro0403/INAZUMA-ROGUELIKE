name: Apply champion hall extraction

on:
  push:
    branches:
      - refactor/champion-hall-presentation

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[auto-champion-hall]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply structural extraction
        run: node tools/apply-champion-hall-extraction.js
      - name: Syntax
        run: |
          node --check js/hall/champion-snapshot.js
          node --check js/hall/champion-presentation.js
          node --check js/app.js
          node --check tests/champion-hall-presentation-domain-test.js
      - name: Targeted regression tests
        run: |
          node tests/champion-hall-presentation-domain-test.js
          node tests/permanent-club-ui-production-path-test.js
          node tests/player-presentation-production-path-test.js
          node tests/finalization-ambiguous-commit-production-test.js
          node tests/real-final-boss-production-path-test.js
          node tests/app-gameplay-persistence-callsite-ownership-test.js
      - name: Diff check
        run: git diff --check
      - name: Commit extracted production tree
        run: |
          rm tools/apply-champion-hall-extraction.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js index.html tests
          git add -u tools/apply-champion-hall-extraction.js
          git commit -m "[auto-champion-hall] refactor: extract champion snapshot and Hall presentation"
          git push
